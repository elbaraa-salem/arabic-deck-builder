id: A0-L02
level: A0
title: هَذَا وهَذِهِ
goal: يشير الطالب إلى الأشياء والأشخاص ويسأل ويجيب باستخدام ما ومن وهذا وهذه

activities:
  - type: introduce
    arabic: كِتَاب
    russian: книга
    image: book

  - type: introduce
    arabic: بَيْت
    image: house

  - type: question_reveal
    question: مَا هَذَا؟
    answer: هَذَا كِتَاب
    image: book

  - type: question_reveal
    question: مَا هَذَا؟
    answer: هَذَا بَيْت
    image: house

  - type: dialogue_build

    speakers:
      A: محمد
      B: أحمد

    image: greeting

    segments:
      - lines:
          - speaker: A
            arabic: السَّلامُ عَلَيْكُم
            russian: Здравствуйте

          - speaker: B
            arabic: وَعَلَيْكُمُ السَّلام

          - speaker: A
            arabic: مَا اسْمُكَ؟

          - speaker: B
            arabic: اِسْمِي أَحْمَد

          - speaker: B
            arabic: وَمَا اسْمُكَ؟

          - speaker: A
            arabic: اِسْمِي مُحَمَّد

      - lines:
          - speaker: A
            arabic: مِنْ أَيْنَ أَنْتَ؟

          - speaker: B
            arabic: أَنَا مِنْ مِصْر

          - speaker: B
            arabic: وَأَنْتَ؟

          - speaker: A
            arabic: أَنَا مِنْ رُوسْيَا

          - speaker: B
            arabic: أَهْلًا وَسَهْلًا

          - speaker: A
            arabic: أَهْلًا بِكَ
