id: A0-L02
level: A0
title: هَذَا وهَذِهِ
goal: يشير الطالب إلى الأشياء والأشخاص ويسأل ويجيب باستخدام ما ومن وهذا وهذه

activities:
  - type: introduce
    arabic: كِتَاب
    translation: книга
    image: book

  - type: introduce
    arabic: بَيْت
    image: house

  # - type: question_reveal
  #   question: مَا هَذَا؟
  #   answer: هَذَا كِتَاب
  #   image: book

  # - type: question_reveal
  #   question: مَا هَذَا؟
  #   answer: هَذَا بَيْت
  #   image: house

  - type: recall

    prompt:
      question: مَا هَذَا؟
      image: book

    answer: كِتَاب

    support:
      stages:
        - translation: книга
          hint: ك...

        - hint: ك...

        - {}

  - type: recall

    prompt:
      question: مَا هَذَا؟
      image: house

    answer: بَيْت

    support:
      stages:
        - translation: house
          hint: بَ...

        - hint: بَ...

        - {}

  - type: discriminate

    prompt:
      question: هَذَا أَمْ هَذِهِ؟
      image: book

    choices:
      - هَذَا
      - هَذِهِ

    answer: هَذَا

    support:
      stages:
        - translation: Что правильно?

        - {}

  - type: transform

    instruction: غَيِّرِ الجُمْلَةَ

    model: أَنَا مِنْ مِصْر

    cue:
      text: رُوسْيَا

    answer: أَنَا مِنْ رُوسْيَا

    support:
      stages:
        - translation: Я из России
          hint: أَنَا مِنْ ...

        - hint: أَنَا مِنْ ...

        - {}

  - type: personalize

    model: أَحْمَد مِنْ مِصْر

    prompt:
      question: وَأَنْتَ؟ مِنْ أَيْنَ أَنْتَ؟

    support:
      stages:
        - translation: А ты? Откуда ты?
          hint: أَنَا مِنْ ...

        - hint: أَنَا مِنْ ...

        - {}

  - type: personalize

    model: اِسْمِي أَحْمَد

    prompt:
      question: مَا اسْمُكَ؟

    support:
      stages:
        - hint: اِسْمِي ...

        - {}

  - type: personalize

    prompt:
      question: مَاذَا تُحِبُّ أَنْ تَفْعَلَ فِي وَقْتِ الفَرَاغِ؟

    support:
      stages:
        - hint: أُحِبُّ أَنْ ...

        - {}
