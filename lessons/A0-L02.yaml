    answer: أَنَا مِنْ رُوسْيَا

    support:
      stages:
        - translation: Я из России
          hint: أَنَا مِنْ ...

        - hint: أَنَا مِنْ ...

        - {}

  - type: personalize

    model: أَحْمَد مِنْ مِصْر

    prompt:
      question: وَأَنْتَ؟ مِنْ أَيْنَ أَنْتَ؟

    support:
      stages:
        - translation: А ты? Откуда ты?
          hint: أَنَا مِنْ ...

        - hint: أَنَا مِنْ ...

        - {}

  - type: personalize

    model: اِسْمِي أَحْمَد

    prompt:
      question: مَا اسْمُكَ؟

    support:
      stages:
        - hint: اِسْمِي ...

        - {}

  - type: personalize

    prompt:
      question: مَاذَا تُحِبُّ أَنْ تَفْعَلَ فِي وَقْتِ الفَرَاغِ؟

    support:
      stages:
        - hint: أُحِبُّ أَنْ ...

        - {}

  - type: interpret

    passage: أَحْمَد مِنْ مِصْر. هُوَ طَبِيب.

    question: مِنْ أَيْنَ أَحْمَد؟

    choices:
      - مِصْر
      - رُوسْيَا
      - فَرَنْسَا

    answer: مِصْر

    support:
      stages:
        - translation: Откуда Ахмед?

        - {}

  - type: interpret

    passage: أَحْمَد مِنْ مِصْر. هُوَ طَبِيب.

    question: مَا عَمَلُ أَحْمَد؟

    choices:
      - طَبِيب
      - مُدَرِّس
      - مُهَنْدِس

    answer: طَبِيب

  - type: information_gap

    instruction: اِسْأَلْ عَنِ المَعْلُومَاتِ النَّاقِصَةِ

    subject: أَحْمَد

    facts:
      - label: الاِسْم
        value: أَحْمَد

      - label: البَلَد
        answer: مِصْر

      - label: العَمَل
        value: طَبِيب

      - label: العُمْر
        answer: ٢٨ سَنَة

    support:
      stages:
        - translation: Спроси о недостающей информации.
          hint: مِنْ أَيْنَ ...؟ / كَمْ عُمْرُ ...؟

        - hint: مِنْ أَيْنَ ...؟ / كَمْ عُمْرُ ...؟

        - {}

  - type: role_play

    instruction: مَثِّلِ المَوْقِفَ

    situation: تَعَرَّفْتَ عَلَى شَخْصٍ جَدِيدٍ

    roles:
      student: طَالِب مِنْ رُوسْيَا
      partner: شَخْص عَرَبِيّ

    goals:
      - سَلِّمْ عَلَيْهِ
      - اسْأَلْهُ عَنْ اسْمِهِ
      - اسْأَلْهُ مِنْ أَيْنَ هُوَ
      - قُلْ لَهُ اسْمَكَ وَبَلَدَكَ

    support:
      stages:
        - translation: Познакомься с новым человеком.
          hint: السَّلامُ عَلَيْكُم / مَا اسْمُكَ؟ / مِنْ أَيْنَ أَنْتَ؟

        - hint: السَّلامُ عَلَيْكُم / مَا اسْمُكَ؟ / مِنْ أَيْنَ أَنْتَ؟

        - {}

  - type: noticing

    instruction: اُنْظُرْ إِلَى الجُمْلَتَيْنِ

    items:
      - text: هَذَا كِتَاب
        image: book

      - text: هَذِهِ سَيَّارَة
        image: car

    question: مَاذَا تُلَاحِظُ؟

    insight: نَسْتَعْمِلُ هَذَا مَعَ المُذَكَّرِ، وَهَذِهِ مَعَ المُؤَنَّثِ.

    support:
      stages:
        - translation: Что ты замечаешь?
          hint: هَذَا ↔ هَذِهِ

        - hint: هَذَا ↔ هَذِهِ

        - {}

  - type: error_correction

    instruction: صَحِّحِ الجُمْلَةَ

    incorrect: هَذَا سَيَّارَة

    correction: هَذِهِ سَيَّارَة

    explanation: سَيَّارَة كَلِمَة مُؤَنَّثَة، لِذَلِكَ نَسْتَعْمِلُ هَذِهِ.

    image: car

    support:
      stages:
        - translation: Исправь предложение.
          hint: هَذَا أَمْ هَذِهِ؟

        - hint: هَذَا أَمْ هَذِهِ؟

        - {}

