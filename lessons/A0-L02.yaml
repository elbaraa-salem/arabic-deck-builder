      - text: أَقُولَ بَلَدِي
        prompt: مِنْ أَيْنَ أَنْتَ؟

      - text: أَسْأَلَ شَخْصًا عَنْ اسْمِهِ

      - text: أَسْأَلَ شَخْصًا عَنْ بَلَدِهِ

      - text: أَسْتَعْمِلَ هَذَا وَهَذِهِ

