    subtitle: الدَّرْسُ الخَامِس

    translation: Семья

  - type: question_reveal
    question: كَمِ السَّاعَةُ؟
    answer: السَّاعَةُ العَاشِرَةُ وَالنِّصْفُ
    image: "@clock/10:30"

  - type: question_reveal
    question: مَا هَذَا الرَّقْمُ؟
    answer: سَبْعَةٌ وَعِشْرُونَ
    image: "@number/999"

  - type: introduce
    arabic: كِتَاب
    translation: книга
    image: book

  - type: introduce
    arabic: بَيْت
    image: house

  - type: question_reveal
    question: مَا هَذَا؟
    answer: هَذَا كِتَاب
    image: book

  - type: question_reveal
    question: مَا هَذَا؟
    answer: هَذَا بَيْت
    image: house

  - type: recall

    prompt:
      question: مَا هَذَا؟
      image: book

    answer: كِتَاب

    support:
      stages:
        - translation: книга
          hint: ك...

        - hint: ك...

        - {}

  - type: section_break

    title: التَّدْرِيب

  - type: recall

    prompt:
      question: مَا هَذَا؟
      image: house

    answer: بَيْت

    support:
      stages:
        - translation: house
          hint: بَ...

        - hint: بَ...

        - {}

  - type: discriminate

    prompt:
      question: هَذَا أَمْ هَذِهِ؟
      image: book

    choices:
      - هَذَا
      - هَذِهِ

    answer: هَذَا

    support:
      stages:
        - translation: Что правильно?

        - {}

  - type: section_break

