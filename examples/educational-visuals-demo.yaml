      numerator: 3
      denominator: 4

  - type: introduce
    arabic: مَا الكَسْرُ المُظَلَّلُ؟
    translation: "5/8"
    visual:
      type: fraction
      numerator: 5
      denominator: 8

  - type: introduce
    arabic: مَا الكَسْرُ المُظَلَّلُ؟
    translation: "12/12"
    visual:
      type: fraction
      numerator: 12
      denominator: 12
